name: Publish OIDC add-on image

# Builds the OIDC add-on for the unmodified upstream Healthchecks image
# (see docker/oidc/README.md) and pushes it to the GitHub Container Registry.
#
# - Pushes to the feature/oidc branch publish the "feature-oidc" and "sha-..." tags
# - Pushing a git tag "oidc-addon-vX.Y.Z" publishes the "X.Y.Z" and "latest" tags

on:
    push:
        branches: [feature/oidc]
        tags: ["oidc-addon-v*"]
        paths:
            - hc/oidc/**
            - docker/oidc/**
            - .github/workflows/publish_oidc_addon.yml
    workflow_dispatch:

permissions: {}

jobs:
    push_to_registry:
        name: Push OIDC add-on image to GHCR
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/healthchecks-oidc-addon
                  tags: |
                      type=match,pattern=oidc-addon-v(.*),group=1
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/oidc-addon-v') }}
                      type=ref,event=branch
                      type=sha

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # No QEMU needed: the build stage runs on the build platform,
            # the final stage only copies files
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/oidc/Dockerfile
                  platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
